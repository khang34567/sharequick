plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quickhub.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.quickhub.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Không dùng thư viện nặng -> Build trên GitHub cực nhanh (~40s) & APK siêu nhẹ (< 1MB)
}
